# =============================================================================
# Experience Model Training Configuration
# =============================================================================

# Base model to fine-tune
base_model: "Qwen/Qwen2.5-3B-Instruct"

# Alternative models (uncomment to use):
# base_model: "meta-llama/Llama-3.2-3B-Instruct"
# base_model: "microsoft/Phi-3-mini-4k-instruct"

# -----------------------------------------------------------------------------
# LoRA Configuration
# -----------------------------------------------------------------------------
lora:
  rank: 16                    # LoRA rank (common: 8, 16, 32)
  alpha: 32                   # LoRA alpha (typically 2 × rank)
  dropout: 0.05               # LoRA dropout
  target_modules:             # Modules to apply LoRA to
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  epochs: 3
  batch_size: 8               # Per-device batch size
  gradient_accumulation: 4    # Effective batch = batch_size × grad_accum = 32
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: "cosine"
  max_seq_length: 2048
  seed: 42

# -----------------------------------------------------------------------------
# Memory Optimization
# -----------------------------------------------------------------------------
optimization:
  use_4bit: true              # QLoRA quantization (recommended for <48GB VRAM)
  gradient_checkpointing: false  # Trade compute for memory (~20% slower)
  bf16: true                  # Use bfloat16 precision

# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
checkpointing:
  save_steps: 200             # Save checkpoint every N steps
  save_total_limit: 2         # Keep only N most recent checkpoints
  early_stopping_patience: 2  # Stop if no improvement for N evals (0=disabled)

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  logging_steps: 10
  eval_strategy: "epoch"      # "epoch", "steps", or "no"
  eval_steps: 500             # If eval_strategy="steps"

# -----------------------------------------------------------------------------
# Hyperparameter Search Ranges (for experimentation)
# -----------------------------------------------------------------------------
# Recommended sweep order:
#   1. lora_rank: [8, 16, 32] - highest impact
#   2. learning_rate: [1e-4, 2e-4, 3e-4, 5e-4]
#   3. batch_size × grad_accum: [32, 48, 64]
