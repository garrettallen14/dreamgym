[project]
name = "experience-model-minimal"
version = "0.1.0"
description = "Minimal implementation for studying Experience Model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0",
    "transformers>=4.36",
    "peft>=0.7",
    "trl>=0.7",
    "datasets",
    "accelerate",
    
    # Quantization (QLoRA)
    "bitsandbytes>=0.43.1",
    
    # Metrics
    "nltk",
    "scikit-learn",
    
    # Utilities
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
    "black",
    "ruff",
]

[project.scripts]
prepare-data = "src.prepare_data:main"
train-model = "src.train:main"
validate-model = "src.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
