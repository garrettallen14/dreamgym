[project]
name = "webshop-experience-model"
version = "0.1.0"
description = "Experience Model for WebShop agent benchmark - DreamGym framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "peft>=0.7",
    "trl>=0.7",
    "datasets",
    "accelerate",
    "wandb",
    "numpy",
    "pandas",
    "tqdm",
    "gymnasium",
    "evaluate",
    "rouge-score",
    "nltk",
    "scikit-learn",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
quantization = [
    "bitsandbytes; sys_platform == 'linux'",
]
dev = [
    "pytest",
    "ipython",
    "jupyterlab",
    "black",
    "ruff",
]

[project.scripts]
extract-trajectories = "webshop_exp.scripts.extract_trajectories:main"
explore-env = "webshop_exp.scripts.explore_env:main"
prepare-experience-data = "webshop_exp.scripts.prepare_experience_data:main"
train-experience-model = "webshop_exp.scripts.train_experience_model:main"
validate-experience-model = "webshop_exp.scripts.validate_experience_model:main"
generate-synthetic = "webshop_exp.scripts.generate_synthetic_rollouts:main"
prepare-agent-data = "webshop_exp.scripts.prepare_agent_data:main"
train-agent = "webshop_exp.scripts.train_agent:main"
evaluate-agents = "webshop_exp.scripts.evaluate_agents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webshop_exp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]
